<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <form>
         <h1 class="h-1">Weather App</h1>
         <p>Get the current weather of any city</p>
         <div class="div-1">
         <div class="div1">
            <input type="text" placeholder="Enter city name"  class="input">
            <button type="submit" class="btn">Get Weather</button>
         </div>
         <div class="div2">
            <img src="https://png.pngtree.com/png-vector/20250317/ourmid/pngtree-fluffy-white-cartoon-cloud-with-blue-outline-png-image_15759606.png" height="70px" width="90px">
            <p id="temp-msg">57</p>
            <p id="city-msg">country info</p>
            <p id="humidity-msg">Rainy</p>
            <p id="wind-msg">Wind Speed</p>
         </div>
        </div>
    </form>
    <script src="wather.js"></script>
</body>
</html>
